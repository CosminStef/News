<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archive — Daily Briefing</title>
<style>
  :root{--bg:#0f172a;--panel:#111c33;--border:#243352;--text:#e7edf7;--muted:#9fb0cc;--head:#f4f8ff;--accent:#38bdf8;--link:#7dd3fc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:17px}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
  h1{font-size:28px;color:var(--head);margin:8px 0 4px;font-weight:800}
  p.sub{color:var(--muted);margin:0 0 22px}
  a.back{color:var(--link);text-decoration:none;font-size:14px}
  ul{list-style:none;padding:0;margin:20px 0 0}
  li{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin:10px 0}
  li a{display:block;padding:14px 16px;color:var(--link);text-decoration:none;font-weight:600;font-size:17px}
  li a:hover{text-decoration:underline}
  li a span{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
  footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Daily Briefing</div>
  <h1>Archive</h1>
  <p class="sub">Past editions of the morning briefing.</p>
  <a class="back" href="../">← Back to today's edition</a>
  <ul>
    <li><a href="2026-11-20.html">November 20, 2026 <span>Dental · AI · Technology · Psychology · Education · Medicine · Economy · Politics</span></a></li>
  </ul>
  <footer>New editions are added here each day.</footer>
</div>
</body>
</html>
