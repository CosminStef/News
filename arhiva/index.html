<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="description" content="Archive of past daily briefing editions.">
<link rel="manifest" href="../manifest.json">
<title>Archive — Daily Briefing</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8cff;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){--bg:#f6f7f9; --surface:#fff; --border:#e2e6ec; --text:#1a1d23; --muted:#5b6473; --accent:#2563eb;}
  }
  :root[data-theme="dark"]{--bg:#0f1115; --surface:#171a21; --border:#2a2f3a; --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8cff;}
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.55; font-size:17px;}
  .wrap{max-width:820px; margin:0 auto; padding:0 16px 48px}
  header{padding:28px 0 16px; border-bottom:1px solid var(--border)}
  .kicker{color:var(--accent); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.72rem}
  h1{font-size:1.8rem; margin:.25em 0 .1em; font-family:Georgia,serif}
  a.home{color:var(--muted); text-decoration:none; font-size:.9rem}
  ul.eds{list-style:none; padding:0; margin:24px 0}
  ul.eds li{margin:0 0 10px}
  ul.eds a{display:block; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; color:var(--text); text-decoration:none}
  ul.eds a:hover{border-color:var(--accent)}
  ul.eds .d{font-weight:600}
  ul.eds .meta{color:var(--muted); font-size:.85rem; margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Daily Briefing</div>
    <h1>Archive</h1>
    <a class="home" href="../">← Back to the latest edition</a>
  </header>

  <ul class="eds">
    <li>
      <a href="2026-11-03.html">
        <span class="d">3 November 2026</span>
        <span class="meta">Dental · AI · Technology · Psychology · Education · Medicine · Economy · Politics</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
