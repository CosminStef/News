<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<link rel="manifest" href="../manifest.json">
<title>Briefing Archive</title>
<style>
  :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e8eaed;--muted:#9aa3b2;--accent:#4f8cff;--accent-soft:#1d2a44}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--muted:#5a6473;--accent:#2563eb;--accent-soft:#e5edff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:17px}
  .wrap{max-width:720px;margin:0 auto;padding:34px 16px 64px}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 8px}
  h1{font-size:28px;margin:0 0 6px;font-weight:800}
  p.sub{color:var(--muted);margin:0 0 24px}
  ul{list-style:none;margin:0;padding:0}
  li a{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 18px;margin:10px 0;color:var(--text);text-decoration:none;font-weight:600}
  li a:hover{background:var(--accent-soft);border-color:var(--accent)}
  li a .arrow{color:var(--accent)}
  .back{display:inline-block;margin:0 0 22px;color:var(--accent);text-decoration:none;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Daily Briefing</p>
  <a class="back" href="../">← Today's edition</a>
  <h1>Archive</h1>
  <p class="sub">Past editions of the Daily Briefing.</p>
  <ul>
    <li><a href="2026-11-28.html"><span>28 November 2026</span><span class="arrow">→</span></a></li>
  </ul>
</div>
</body>
</html>
