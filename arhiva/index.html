<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Archive of past daily briefings.">
<link rel="manifest" href="../manifest.json">
<title>Briefing — Archive</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --border:#2a2f3a; --text:#e7e9ee;
    --muted:#9aa3b2; --accent:#4f8cff; --radius:14px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f6f8; --surface:#ffffff; --border:#e1e4ea; --text:#1a1d24;
      --muted:#5a6475; --accent:#2563eb;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; font-size:17px;}
  .wrap{max-width:760px; margin:0 auto; padding:34px 16px 80px;}
  .kicker{color:var(--accent); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:13px;}
  h1{font-size:1.7rem; margin:.25em 0 .4em;}
  a.home{display:inline-block; margin-bottom:24px; color:var(--accent); text-decoration:none; font-weight:600;}
  a.home:hover{text-decoration:underline;}
  ul.eds{list-style:none; padding:0; margin:0;}
  ul.eds li{margin:10px 0;}
  ul.eds a{
    display:block; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 18px; color:var(--text); text-decoration:none;
  }
  ul.eds a:hover{border-color:var(--accent);}
  .muted{color:var(--muted); font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Daily Briefing</div>
  <h1>Archive</h1>
  <a class="home" href="../">&larr; Back to today's briefing</a>
  <ul class="eds">
    <li><a href="2026-11-01.html">1 November 2026 <span class="muted">&mdash; latest edition</span></a></li>
  </ul>
  <p class="muted">Past editions are saved here each day as <code>YYYY-MM-DD.html</code>.</p>
</div>
</body>
</html>
