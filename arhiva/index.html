<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="../manifest.json">
<title>Archive — The Morning Briefing</title>
<style>
  :root{--bg:#0f1115;--panel:#161922;--ink:#e9ecf2;--muted:#9aa3b2;--line:#262b38;--accent:#e8c37a;--link:#8ab4ff}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f7f9;--panel:#fff;--ink:#1a1d24;--muted:#5b6472;--line:#e2e6ee;--accent:#9a6b14;--link:#2456c7}}
  :root[data-theme="dark"]{--bg:#0f1115;--panel:#161922;--ink:#e9ecf2;--muted:#9aa3b2;--line:#262b38;--accent:#e8c37a;--link:#8ab4ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:17px}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
  header{border-bottom:2px solid var(--accent);padding:28px 0 16px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,6vw,38px);margin:6px 0}
  a.home{color:var(--link);text-decoration:none;font-size:14px}
  ul{list-style:none;padding:0;margin:24px 0}
  li{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0}
  li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
  li a:hover{border-color:var(--accent)}
  .ed-date{font-weight:700}
  .ed-go{color:var(--accent);font-size:14px}
  footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">Archive</div>
  <h1>The Morning Briefing</h1>
  <a class="home" href="../">← Today's edition</a>
</header>

<ul>
  <li><a href="2026-11-02.html"><span class="ed-date">Monday, November 2, 2026</span><span class="ed-go">Read →</span></a></li>
</ul>

<footer>Past editions are preserved as published. New editions are added here each day.</footer>
</div>
</body>
</html>
