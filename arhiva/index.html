<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <meta name="theme-color" content="#0f1115">
  <title>Archive — Daily Briefing</title>
  <style>
    :root{--bg:#0f1115;--panel:#161a21;--border:#262c38;--text:#e7ecf3;--muted:#9aa6b8;--accent:#4f9cf9}
    @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7fa;--panel:#fff;--border:#dfe4ec;--text:#121722;--muted:#53617a;--accent:#1f6fe0}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:17px}
    .wrap{max-width:720px;margin:0 auto;padding:30px 16px 60px}
    .kicker{color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
    h1{font-size:28px;margin:8px 0 4px;font-weight:800;letter-spacing:-.02em}
    p.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
    a.back{color:var(--accent);text-decoration:none;font-size:14.5px;font-weight:600}
    ul{list-style:none;padding:0;margin:18px 0 0}
    li{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin:10px 0}
    li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;text-decoration:none;color:var(--text)}
    li a:hover{border-color:var(--accent)}
    .ed-date{font-weight:700;font-size:17px}
    .ed-meta{color:var(--muted);font-size:13px}
    .chev{color:var(--accent);font-size:18px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Daily Briefing</div>
  <h1>Archive</h1>
  <p class="sub">Past editions. <a class="back" href="../">← Today's edition</a></p>
  <ul>
    <li>
      <a href="2026-11-11.html">
        <span>
          <span class="ed-date">11 November 2026</span><br>
          <span class="ed-meta">Dental · AI · Tech · Psychology · Education · Medicine · Economy · Politics</span>
        </span>
        <span class="chev">›</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
