<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archive — Daily Briefing</title>
<style>
  :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e7e9ee;--muted:#a2a9b8;--accent:#e8c477;--link:#8ab4ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:17px}
  .wrap{max-width:640px;margin:0 auto;padding:40px 16px 72px}
  h1{font-family:Georgia,serif;font-size:clamp(26px,6vw,36px);margin:0 0 4px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
  p.lead{color:var(--muted);font-size:15px;margin:6px 0 26px}
  ul{list-style:none;margin:0;padding:0}
  li a{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 17px;margin:10px 0;text-decoration:none;color:var(--text)}
  li a:hover{border-color:var(--accent)}
  li .d{font-weight:600}
  li .arrow{color:var(--accent)}
  a.back{display:inline-block;margin-top:24px;color:var(--link);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Daily Briefing</div>
  <h1>Archive</h1>
  <p class="lead">Past editions, most recent first.</p>
  <ul>
    <li><a href="2026-10-13.html"><span class="d">October 13, 2026</span><span class="arrow">→</span></a></li>
  </ul>
  <a class="back" href="../">← Back to today's edition</a>
</div>
</body>
</html>
