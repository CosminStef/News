<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<title>Briefing — Archive</title>
<style>
  :root{--bg:#0f172a;--card:#16223c;--text:#e8eef7;--muted:#9fb0c9;--line:#263655;--accent:#38bdf8;--accent2:#7dd3fc}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f7fb;--card:#fff;--text:#17233b;--muted:#54657f;--line:#dde6f1;--accent:#0369a1;--accent2:#0284c7}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;padding:0 16px 56px;font-size:17px}
  .wrap{max-width:680px;margin:0 auto}
  header{padding:34px 0 18px;border-bottom:2px solid var(--line)}
  .kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 8px}
  h1{font-family:Georgia,serif;font-size:1.9rem;margin:0}
  a.back{display:inline-block;margin:20px 0 8px;color:var(--accent2);text-decoration:none;font-weight:600}
  ul{list-style:none;padding:0;margin:14px 0}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
  li a{display:block;padding:15px 16px;color:var(--text);text-decoration:none;font-weight:600}
  li a:hover{color:var(--accent)}
  li .d{display:block;color:var(--muted);font-size:.82rem;font-weight:400;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">Daily Briefing</p>
    <h1>Archive</h1>
  </header>
  <a class="back" href="../">← Today's edition</a>
  <ul>
    <li><a href="2026-11-10.html">November 10, 2026<span class="d">Monday edition — dental, AI, technology, psychology, education, medicine, economy, politics</span></a></li>
  </ul>
</div>
</body>
</html>
