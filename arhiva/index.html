<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Briefing — Archive</title>
  <style>
    :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e7e9ee;--muted:#9aa2b1;--accent:#e8c17a;--link:#7fb2ff;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:17px;}
    .wrap{max-width:640px;margin:0 auto;padding:24px 16px;}
    .kicker{color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
    h1{font-family:Georgia,serif;font-size:28px;margin:.2em 0 .1em;}
    p.lead{color:var(--muted);font-size:14px;margin-top:4px;}
    ul{list-style:none;padding:0;margin:22px 0 0;}
    li{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:10px 0;}
    li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--link);font-weight:600;}
    li a:hover{background:#1e222b;}
    li a .d{color:var(--muted);font-weight:400;font-size:13px;}
    .back{display:inline-block;margin-top:24px;color:var(--muted);text-decoration:none;font-size:14px;}
    .back:hover{color:var(--link);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Daily Briefing</div>
    <h1>Archive</h1>
    <p class="lead">Past editions, newest first.</p>
    <ul>
      <li><a href="2026-11-25.html"><span>Tuesday, 25 November 2026</span><span class="d">2026-11-25</span></a></li>
    </ul>
    <a class="back" href="../">← Back to today's briefing</a>
  </div>
</body>
</html>
