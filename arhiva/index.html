<title>Briefing — Archive</title>
<style>
  :root{--bg:#0f1115;--surface:#171a21;--text:#e7e9ee;--muted:#9aa3b2;--line:#272c37;--accent:#4da3ff}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--surface:#fff;--text:#1a1d24;--muted:#5a6473;--line:#dfe3ea;--accent:#1f6fd6}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:17px}
  .wrap{max-width:680px;margin:0 auto;padding:32px 16px 64px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px}
  h1{font-family:Georgia,serif;font-size:28px;margin:0 0 6px}
  p.lead{color:var(--muted);font-size:14px;margin:0 0 24px}
  a.back{color:var(--accent);text-decoration:none;font-size:14px}
  ul{list-style:none;padding:0;margin:20px 0}
  li{margin:0 0 10px}
  li a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--text);text-decoration:none;font-weight:600}
  li a:hover{border-color:var(--accent);color:var(--accent)}
  li a .d{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Daily Briefing</p>
  <h1>Archive</h1>
  <p class="lead">Past editions. The newest edition is always at the <a class="back" href="../">front page</a>.</p>

</html>
