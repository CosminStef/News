<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="description" content="Archive of past daily briefings.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="../manifest.json">
<title>Briefing — Archive</title>
<style>
  :root{--bg:#0f172a;--card:#16223c;--line:#243149;--txt:#e6edf6;--mut:#9fb0c7;--accent:#38bdf8;--accent2:#7dd3fc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:17px}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{padding:30px 16px 22px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b1424,#0f172a)}
  header .kicker{color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:700}
  header h1{margin:.3em 0 .1em;font-size:26px;font-weight:800}
  header p{margin:0;color:var(--mut);font-size:14px}
  ul.eds{list-style:none;padding:0;margin:22px 0}
  ul.eds li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
  ul.eds li a.title{font-weight:700;font-size:17px}
  ul.eds li .d{color:var(--mut);font-size:13px}
  .back{display:inline-block;margin:10px 0;padding:9px 16px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--accent2);font-weight:600}
  footer{margin:34px 0 24px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="kicker">Daily Research Briefing</div>
  <h1>Archive</h1>
  <p>Past editions</p>
</header>
<div class="wrap">
  <a class="back" href="../">← Latest edition</a>
  <ul class="eds">
    <li>
      <a class="title" href="2026-10-19.html">Monday, October 19, 2026</a>
      <span class="d">2026-10-19</span>
    </li>
  </ul>
  <footer>New editions are added here each day.</footer>
</div>
</body>
</html>
