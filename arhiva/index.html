<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0f172a">
<title>Briefing — Archive</title>
<style>
  :root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#818cf8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;padding:0 16px 64px;font-size:17px}
  .wrap{max-width:720px;margin:0 auto}
  header{padding:32px 0 18px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .kicker{color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  h1{font-size:28px;margin:8px 0 4px;font-weight:800}
  .back{color:var(--accent2);text-decoration:none;font-size:14px}
  .back:hover{text-decoration:underline}
  ul.eds{list-style:none;margin:8px 0 0;padding:0}
  ul.eds li{margin:0}
  ul.eds a{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0;text-decoration:none;color:var(--text)}
  ul.eds a:hover{border-color:var(--accent)}
  ul.eds .d{font-weight:700;font-variant-numeric:tabular-nums}
  ul.eds .w{color:var(--muted);font-size:14px}
  ul.eds .arrow{color:var(--accent);font-size:18px}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){--bg:#f1f5f9;--surface:#fff;--border:#d7dee8;--text:#0f172a;--muted:#64748b;--accent:#0284c7;--accent2:#4f46e5}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Daily Briefing</div>
    <h1>Archive</h1>
    <a class="back" href="../index.html">← Today's edition</a>
  </header>
  <ul class="eds">
    <li>
      <a href="2026-11-08.html">
        <span><span class="d">2026-11-08</span> &nbsp; <span class="w">Sunday</span></span>
        <span class="arrow">→</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
