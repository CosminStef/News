<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Archive of past editions of the daily briefing.">
<link rel="manifest" href="../manifest.json">
<title>Archive — The Morning Brief</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel-2:#1d212b;--border:#2a2f3a;--text:#e8eaed;--muted:#a0a6b0;--faint:#767c88;--accent:#e8c37a;--link:#7fb2ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:17px;padding:0 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto}
  header{padding:30px 0 16px;border-bottom:1px solid var(--border)}
  .kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-family:Georgia,serif;font-size:1.8rem;margin:.25em 0 .1em}
  .sub{color:var(--muted);font-size:.95rem}
  a.back{display:inline-block;margin:14px 0;color:var(--accent);text-decoration:none;font-weight:600;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:.9rem}
  a.back:hover{background:var(--panel-2)}
  ul.editions{list-style:none;padding:0;margin:18px 0 60px}
  ul.editions li{margin:0 0 10px}
  ul.editions a{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  ul.editions a:hover{background:var(--panel-2);border-color:var(--accent)}
  .ed-date{font-weight:600}
  .ed-meta{color:var(--faint);font-size:.85rem}
  .arrow{color:var(--accent)}
  footer{color:var(--faint);font-size:.82rem;padding-bottom:50px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">The Morning Brief</div>
    <h1>Archive</h1>
    <div class="sub">Past editions, newest first.</div>
  </header>

  <a class="back" href="../">← Today's edition</a>

  <ul class="editions">
    <li>
      <a href="2026-11-18.html">
        <span><span class="ed-date">Wednesday, 18 November 2026</span><br><span class="ed-meta">Dental · AI · Tech · Psychology · Education · Medicine · Economy · Politics</span></span>
        <span class="arrow">→</span>
      </a>
    </li>
  </ul>

  <footer>New editions are added here each day.</footer>
</div>
</body>
</html>
