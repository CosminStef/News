<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<link rel="manifest" href="../manifest.json">
<title>Archive — Daily Briefing</title>
<style>
  :root{--bg:#0f172a;--card:#1b2540;--ink:#e8edf7;--muted:#9aa7c2;--line:#2a3860;--accent:#6ea8fe}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0d1427,#0f172a 40%);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:720px;margin:0 auto;padding:30px 16px 64px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:26px;margin:8px 0 4px}
  p.sub{color:var(--muted);margin:0 0 22px}
  ul{list-style:none;padding:0;margin:0}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:14px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  li .d{font-weight:600}
  li .w{color:var(--muted);font-size:13px}
  .back{display:inline-block;margin-bottom:18px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Back to today's briefing</a>
  <div class="kicker">Daily Briefing</div>
  <h1>Archive</h1>
  <p class="sub">Past editions, newest first.</p>
  <ul>
    <li>
      <span class="d"><a href="2026-11-26.html">26 November 2026</a></span>
      <span class="w">Wednesday</span>
    </li>
  </ul>
</div>
</body>
</html>
