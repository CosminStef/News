<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <meta name="theme-color" content="#0f1419">
  <meta name="description" content="Archive of past editions of the Daily Briefing.">
  <link rel="manifest" href="../manifest.json">
  <title>Archive — Daily Briefing</title>
  <style>
    :root{
      --bg:#f6f7f9; --surface:#ffffff; --text:#1a1f26; --muted:#5c6773;
      --line:#e2e6eb; --accent:#1f6feb; --accent-soft:#e8f0fe; --radius:14px;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0f1419; --surface:#171d25; --text:#e8ecf1; --muted:#9aa6b2;
        --line:#2a333f; --accent:#4c9bff; --accent-soft:#17283f; }
    }
    *{box-sizing:border-box}
    body{margin:0; background:var(--bg); color:var(--text); font-size:17px; line-height:1.55;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .wrap{max-width:720px; margin:0 auto; padding:30px 16px 64px}
    .eyebrow{color:var(--accent); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:12.5px; margin:0 0 6px}
    h1{font-size:26px; margin:0 0 18px; letter-spacing:-.01em}
    a.back{display:inline-block; margin-bottom:22px; color:var(--accent); text-decoration:none; font-weight:600; font-size:14px}
    ul{list-style:none; margin:0; padding:0}
    li{margin:0 0 10px}
    li a{display:flex; justify-content:space-between; align-items:center; gap:12px;
      background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
      padding:14px 16px; text-decoration:none; color:var(--text); font-weight:600}
    li a:hover{border-color:var(--accent)}
    li a .arrow{color:var(--accent)}
    .day{color:var(--muted); font-weight:400; font-size:14px}
    p.empty{color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Daily Briefing</p>
  <h1>Archive</h1>
  <a class="back" href="../">← Back to today's edition</a>
  <ul>
    <li>
      <a href="2026-11-06.html">
        <span>November 6, 2026 <span class="day">· Friday</span></span>
        <span class="arrow">→</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
