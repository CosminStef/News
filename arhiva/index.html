  <title>Briefing — Archive</title>

  <style>
    :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e8eaed;--muted:#9aa1ad;--accent:#6ea8fe;}
    @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--surface:#fff;--border:#dcdfe6;--text:#1b1e24;--muted:#5c6470;--accent:#2563eb;}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:17px;}
    .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px;}
    .kicker{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;}
    h1{font-size:1.7rem;margin:.2em 0 .4em;}
    a.back{color:var(--accent);text-decoration:none;font-size:.9rem;}
    ul{list-style:none;padding:0;margin:20px 0 0;}
    li{margin:10px 0;}
    li a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);text-decoration:none;font-weight:600;}
    li a:hover{border-color:var(--accent);color:var(--accent);}
    li span{display:block;color:var(--muted);font-size:.82rem;font-weight:400;margin-top:2px;}
  </style>
</head>
