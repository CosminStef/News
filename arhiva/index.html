<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="../manifest.json">
  <title>Archive — Daily Briefing</title>
  <style>
    :root{--bg:#0f172a;--panel:#111c33;--line:#24324f;--text:#e7edf7;--muted:#9fb0cc;--accent:#38bdf8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
    .wrap{max-width:720px;margin:0 auto;padding:24px 16px 72px}
    .kicker{color:var(--accent);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
    h1{font-size:1.6rem;margin:.25rem 0 .2rem}
    p.lead{color:var(--muted);font-size:.92rem}
    a.back{display:inline-block;margin:6px 0 20px;color:var(--accent);text-decoration:none;font-weight:600}
    ul{list-style:none;margin:0;padding:0}
    li{margin:10px 0}
    li a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);text-decoration:none;font-weight:600}
    li a:hover{border-color:var(--accent)}
    li a span{display:block;color:var(--muted);font-weight:400;font-size:.82rem;margin-top:3px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Daily Briefing</div>
    <h1>Archive</h1>
    <p class="lead">Past editions of the daily briefing.</p>
    <a class="back" href="../index.html">← Today's edition</a>
    <ul>
      <li><a href="2026-10-31.html">Friday, October 31, 2026<span>Dental · AI · Technology · Psychology · Education · Medicine · Economy · Politics</span></a></li>
    </ul>
  </div>
</body>
</html>
