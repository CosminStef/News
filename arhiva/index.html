<style>
  :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e8eaed;--muted:#9aa3b2;--accent:#4f8cff;--accent-soft:#1d2a44}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f7f9;--surface:#fff;--border:#e1e4ea;--text:#1a1d23;--muted:#5b6472;--accent:#2563eb;--accent-soft:#e7efff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  .kicker{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem}
  h1{font-size:1.6rem;margin:.25rem 0 1rem}
  a.back{display:inline-block;margin-bottom:18px;background:var(--accent-soft);color:var(--accent);padding:7px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem}
  ul{list-style:none;margin:0;padding:0}
  li{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:10px 0}
  li a{display:block;padding:14px 16px;color:var(--text);text-decoration:none;font-weight:600}
  li a:hover{color:var(--accent)}
  li a span{display:block;color:var(--muted);font-weight:400;font-size:.85rem;margin-top:2px}
  p.note{color:var(--muted);font-size:.85rem;margin-top:24px}
</style>
</head>
