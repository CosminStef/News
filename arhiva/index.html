<style>

  ul{list-style:none;padding:0;margin:22px 0}
  li{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:0 0 10px}
  li a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--text);font-weight:600}
