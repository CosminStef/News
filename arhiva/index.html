<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="description" content="Archive of past daily briefing editions.">
<title>Briefing — Archive</title>
<style>
  :root{--bg:#0f172a;--card:#172036;--ink:#e8edf7;--muted:#9fb0cc;--faint:#728099;--line:#26334f;--accent:#6ea8fe;--accent2:#8b7bf0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:34px 16px 72px}
  .kicker{color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
  h1{font-size:clamp(26px,6vw,36px);margin:8px 0 6px;letter-spacing:-.02em}
  p.sub{color:var(--muted);margin:0 0 24px}
  a.home{display:inline-block;margin-bottom:22px;color:var(--accent);text-decoration:none;font-size:14px}
  a.home:hover{text-decoration:underline}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0 0 10px}
  li a{display:flex;align-items:baseline;gap:12px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
  li a:hover{border-color:var(--accent)}
  .d{font-weight:700;font-variant-numeric:tabular-nums}
  .t{color:var(--muted);font-size:14px}
  footer{margin-top:40px;color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Personal Daily Briefing</div>
  <h1>Archive</h1>
  <p class="sub">Past editions, newest first.</p>
  <a class="home" href="../">← Today's edition</a>
  <ul id="editions">
    <li><a href="2026-11-04.html"><span class="d">4 November 2026</span><span class="t">Tuesday edition</span></a></li>
  </ul>
  <footer>New editions are added here each morning.</footer>
</div>
</body>
</html>
