<style>
  :root{--bg:#f7f8fa;--card:#fff;--text:#1a1d21;--muted:#5b6470;--line:#e3e7ec;--accent:#2a6df4;--accent-weak:#eaf1ff;--shadow:0 1px 3px rgba(20,30,50,.07)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#171b21;--text:#e8ebf0;--muted:#9aa4b2;--line:#272d36;--accent:#5b93ff;--accent-weak:#18263f;--shadow:0 1px 3px rgba(0,0,0,.4)}}
  :root[data-theme="dark"]{--bg:#0f1216;--card:#171b21;--text:#e8ebf0;--muted:#9aa4b2;--line:#272d36;--accent:#5b93ff;--accent-weak:#18263f;--shadow:0 1px 3px rgba(0,0,0,.4)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px}
  .kicker{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:1.6rem;margin:.25em 0 .4em}
  a.home{display:inline-block;margin-bottom:18px;background:var(--accent-weak);color:var(--accent);padding:6px 14px;border-radius:999px;font-weight:600;text-decoration:none;font-size:.88rem}
  ul.ed{list-style:none;padding:0;margin:0}
  ul.ed li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
  ul.ed a{color:var(--text);text-decoration:none;font-weight:600;font-size:1.05rem}
  ul.ed a:hover{color:var(--accent)}
  ul.ed .d{color:var(--muted);font-size:.85rem;margin-top:2px}
</style>
</head>
