<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0f1115">
<title>Briefing — Archive</title>
<style>
  :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e8eaed;--muted:#9aa3b2;--accent:#3b82f6;--accent-soft:#1d2a44}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f7f9;--surface:#fff;--border:#e2e5ea;--text:#1a1d23;--muted:#5a6472;--accent:#2563eb;--accent-soft:#e4edff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:30px 16px 64px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:26px;margin:6px 0 2px;font-weight:800}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
  a.back{display:inline-block;margin-bottom:20px;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:9px}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0 0 8px}
  li a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--text)}
  li a:hover{border-color:var(--accent)}
  li a .d{font-weight:700;font-size:16px}
  li a .w{color:var(--muted);font-size:13px}
  li a .arrow{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Personal Daily Briefing</div>
  <h1>Archive</h1>
  <p class="sub">Past editions, newest first.</p>
  <a class="back" href="../">← Today's edition</a>
  <ul>
    <li><a href="2026-11-22.html"><span><span class="d">22 November 2026</span></span><span class="w">Saturday</span><span class="arrow">→</span></a></li>
  </ul>
</div>
</body>
</html>
