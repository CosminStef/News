<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archive — Daily Briefing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0f1115">
<style>
  :root{--bg:#0f1115;--surface:#171a21;--border:#2a2f3a;--text:#e8eaed;--muted:#9aa3b2;--accent:#4da3ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;font-size:17px;}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 64px;}
  .kicker{color:var(--accent);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;}
  h1{font-family:Georgia,serif;font-size:28px;margin:6px 0 4px;}
  p.sub{color:var(--muted);margin:0 0 20px;}
  a.back{color:var(--accent);text-decoration:none;font-size:14px;}
  ul{list-style:none;padding:0;margin:20px 0 0;}
  li{margin:0 0 10px;}
  li a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);text-decoration:none;}
  li a:hover{border-color:var(--accent);color:var(--accent);}
  .d{font-weight:700;}
  .t{color:var(--muted);font-size:14px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){--bg:#f4f5f7;--surface:#fff;--border:#dcdfe5;--text:#1a1d23;--muted:#5a6473;--accent:#1769c7;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Daily Briefing</div>
  <h1>Archive</h1>
  <p class="sub">Past editions. <a class="back" href="../">← Today's edition</a></p>
  <ul>
    <li><a href="2026-10-29.html"><span class="d">29 October 2026</span> · <span class="t">Thursday edition</span></a></li>
  </ul>
</div>
</body>
</html>
