<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Briefing">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="../manifest.json">
  <title>Archive — Daily Briefing</title>
  <style>
    :root { --bg:#0f172a; --surface:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --border:#334155; --link:#7dd3fc; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; font-size:17px; -webkit-text-size-adjust:100%; }
    .wrap { max-width:720px; margin:0 auto; padding:16px; }
    header { padding:28px 0 20px; border-bottom:2px solid var(--border); margin-bottom:20px; }
    header h1 { font-size:1.6rem; margin:0 0 6px; }
    header .sub { color:var(--muted); font-size:0.95rem; }
    a.home { display:inline-block; margin-top:14px; padding:7px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--link); text-decoration:none; font-size:0.9rem; }
    a.home:hover { background:#263449; }
    ul.editions { list-style:none; padding:0; margin:0; }
    ul.editions li { margin:10px 0; }
    ul.editions a { display:block; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--link); text-decoration:none; font-weight:600; }
    ul.editions a:hover { background:#263449; }
    ul.editions .meta { display:block; color:var(--muted); font-weight:400; font-size:0.85rem; margin-top:2px; }
    footer { margin:40px 0 24px; padding-top:20px; border-top:1px solid var(--border); color:var(--muted); font-size:0.85rem; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>&#128218; Archive</h1>
    <div class="sub">Past editions of the Daily Briefing.</div>
    <a class="home" href="../">&larr; Current edition</a>
  </header>

  <ul class="editions">
    <li>
      <a href="2026-10-23.html">October 23, 2026
        <span class="meta">Friday &middot; 8 categories</span>
      </a>
    </li>
  </ul>

  <footer>
    <p>New editions are added here each day.</p>
  </footer>
</div>
</body>
</html>
